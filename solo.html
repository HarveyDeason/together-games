<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12131a">
  <title>Together Games</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="room-head">
    <a class="room-code" href="index.html">&larr; Back</a>
    <div class="opponent">On your own</div>
  </header>

  <main class="room-main">
    <p class="score-line" id="score-line"></p>
    <p class="turn-line" id="turn-line"></p>

    <nav class="game-picker" id="game-picker" aria-label="Games"></nav>

    <section id="game" aria-live="polite"></section>

    <button type="button" id="rematch" class="btn" hidden>Play again</button>

    <p class="solo-note">
      Nobody else can see this one. It is not saved to a room, and it works
      with no signal at all.
    </p>
  </main>

  <script type="module" src="src/main-solo.js"></script>
</body>
</html>
